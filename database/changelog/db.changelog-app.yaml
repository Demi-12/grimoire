databaseChangeLog:
  - changeSet:
      id: users-001-roles-and-approval
      author: grimoire
      comment: >-
        Site roles (admin, dm, player) and an approval status so new sign-ups wait for an admin.
        Accounts created before this change start as pending; GRIMOIRE_ADMIN_EMAILS promotes the owner.
      changes:
        - sql:
            splitStatements: true
            sql: |
              ALTER TABLE "user"
                ADD COLUMN "role" TEXT NOT NULL DEFAULT 'player',
                ADD COLUMN "status" TEXT NOT NULL DEFAULT 'pending';
              ALTER TABLE "user"
                ADD CONSTRAINT "user_role_check" CHECK ("role" IN ('admin', 'dm', 'player')),
                ADD CONSTRAINT "user_status_check" CHECK ("status" IN ('pending', 'approved', 'blocked'));
              CREATE INDEX "user_status_idx" ON "user" ("status");
      rollback:
        - sql:
            splitStatements: true
            sql: |
              DROP INDEX IF EXISTS "user_status_idx";
              ALTER TABLE "user" DROP COLUMN IF EXISTS "status", DROP COLUMN IF EXISTS "role";

  - changeSet:
      id: data-001-campaigns-and-characters
      author: grimoire
      comment: Campaigns shared between accounts and characters stored server-side.
      changes:
        - sql:
            splitStatements: true
            sql: |
              CREATE TABLE "campaign" (
                "id" UUID PRIMARY KEY DEFAULT gen_random_uuid(),
                "ownerId" TEXT NOT NULL REFERENCES "user" ("id") ON DELETE CASCADE,
                "name" TEXT NOT NULL CHECK (char_length(btrim("name")) BETWEEN 1 AND 80),
                "description" TEXT NOT NULL DEFAULT '' CHECK (char_length("description") <= 1000),
                "createdAt" TIMESTAMPTZ NOT NULL DEFAULT now(),
                "updatedAt" TIMESTAMPTZ NOT NULL DEFAULT now()
              );
              CREATE INDEX "campaign_ownerId_idx" ON "campaign" ("ownerId");

              CREATE TABLE "campaign_member" (
                "campaignId" UUID NOT NULL REFERENCES "campaign" ("id") ON DELETE CASCADE,
                "userId" TEXT NOT NULL REFERENCES "user" ("id") ON DELETE CASCADE,
                "role" TEXT NOT NULL CHECK ("role" IN ('dm', 'player')),
                "addedAt" TIMESTAMPTZ NOT NULL DEFAULT now(),
                PRIMARY KEY ("campaignId", "userId")
              );
              CREATE INDEX "campaign_member_userId_idx" ON "campaign_member" ("userId");

              CREATE TABLE "character" (
                "id" UUID PRIMARY KEY DEFAULT gen_random_uuid(),
                "ownerId" TEXT NOT NULL REFERENCES "user" ("id") ON DELETE CASCADE,
                "campaignId" UUID REFERENCES "campaign" ("id") ON DELETE SET NULL,
                "name" TEXT NOT NULL CHECK (char_length(btrim("name")) BETWEEN 1 AND 50),
                "level" INTEGER NOT NULL CHECK ("level" BETWEEN 1 AND 20),
                "data" JSONB NOT NULL DEFAULT '{}'::jsonb,
                "createdAt" TIMESTAMPTZ NOT NULL DEFAULT now(),
                "updatedAt" TIMESTAMPTZ NOT NULL DEFAULT now()
              );
              CREATE INDEX "character_ownerId_idx" ON "character" ("ownerId");
              CREATE INDEX "character_campaignId_idx" ON "character" ("campaignId");
      rollback:
        - sql:
            splitStatements: true
            sql: |
              DROP TABLE IF EXISTS "character";
              DROP TABLE IF EXISTS "campaign_member";
              DROP TABLE IF EXISTS "campaign";

  - changeSet:
      id: data-002-campaign-invites
      author: grimoire
      comment: Shareable, expiring, revocable invite links that let an approved account join a campaign as a player.
      changes:
        - sql:
            splitStatements: true
            sql: |
              CREATE TABLE "campaign_invite" (
                "id" UUID PRIMARY KEY DEFAULT gen_random_uuid(),
                "campaignId" UUID NOT NULL REFERENCES "campaign" ("id") ON DELETE CASCADE,
                "token" TEXT NOT NULL UNIQUE,
                "createdBy" TEXT NOT NULL REFERENCES "user" ("id") ON DELETE CASCADE,
                "createdAt" TIMESTAMPTZ NOT NULL DEFAULT now(),
                "expiresAt" TIMESTAMPTZ NOT NULL
              );
              CREATE INDEX "campaign_invite_campaignId_idx" ON "campaign_invite" ("campaignId");
      rollback:
        - sql:
            sql: DROP TABLE IF EXISTS "campaign_invite";

  - changeSet:
      id: data-003-creatures
      author: grimoire
      comment: Personal creature catalog moved from browser storage into the account.
      changes:
        - sql:
            splitStatements: true
            sql: |
              CREATE TABLE "creature" (
                "id" UUID PRIMARY KEY DEFAULT gen_random_uuid(),
                "ownerId" TEXT NOT NULL REFERENCES "user" ("id") ON DELETE CASCADE,
                "name" TEXT NOT NULL CHECK (char_length(btrim("name")) BETWEEN 1 AND 60),
                "xp" INTEGER NOT NULL CHECK ("xp" BETWEEN 1 AND 100000),
                "source" TEXT NOT NULL DEFAULT '' CHECK (char_length("source") <= 60),
                "monsterSlug" TEXT CHECK (char_length("monsterSlug") <= 100),
                "cr" NUMERIC,
                "type" TEXT CHECK (char_length("type") <= 40),
                "roleTags" JSONB NOT NULL DEFAULT '[]'::jsonb,
                "createdAt" TIMESTAMPTZ NOT NULL DEFAULT now()
              );
              CREATE INDEX "creature_ownerId_idx" ON "creature" ("ownerId");
              CREATE UNIQUE INDEX "creature_owner_slug_idx" ON "creature" ("ownerId", "monsterSlug") WHERE "monsterSlug" IS NOT NULL;
      rollback:
        - sql:
            sql: DROP TABLE IF EXISTS "creature";

  - changeSet:
      id: data-004-encounters
      author: grimoire
      comment: Encounter journal per campaign; visible only to the campaign's DMs so prepared encounters stay secret.
      changes:
        - sql:
            splitStatements: true
            sql: |
              CREATE TABLE "encounter" (
                "id" UUID PRIMARY KEY DEFAULT gen_random_uuid(),
                "campaignId" UUID NOT NULL REFERENCES "campaign" ("id") ON DELETE CASCADE,
                "createdBy" TEXT NOT NULL REFERENCES "user" ("id") ON DELETE CASCADE,
                "title" TEXT NOT NULL CHECK (char_length(btrim("title")) BETWEEN 1 AND 80),
                "notes" TEXT NOT NULL DEFAULT '' CHECK (char_length("notes") <= 2000),
                "status" TEXT NOT NULL DEFAULT 'planned' CHECK ("status" IN ('planned', 'played')),
                "difficulty" TEXT NOT NULL CHECK ("difficulty" IN ('low', 'moderate', 'high')),
                "budget" INTEGER NOT NULL CHECK ("budget" >= 0),
                "totalXp" INTEGER NOT NULL CHECK ("totalXp" >= 0),
                "partyLevels" JSONB NOT NULL DEFAULT '[]'::jsonb,
                "lines" JSONB NOT NULL DEFAULT '[]'::jsonb,
                "playedAt" TIMESTAMPTZ,
                "createdAt" TIMESTAMPTZ NOT NULL DEFAULT now(),
                "updatedAt" TIMESTAMPTZ NOT NULL DEFAULT now()
              );
              CREATE INDEX "encounter_campaignId_idx" ON "encounter" ("campaignId", "createdAt" DESC);
      rollback:
        - sql:
            sql: DROP TABLE IF EXISTS "encounter";

  - changeSet:
      id: users-002-preferences
      author: grimoire
      comment: Language and theme follow the account across devices; legacyImportedAt replaces the per-browser import flag.
      changes:
        - sql:
            splitStatements: true
            sql: |
              ALTER TABLE "user"
                ADD COLUMN "locale" TEXT,
                ADD COLUMN "theme" TEXT,
                ADD COLUMN "legacyImportedAt" TIMESTAMPTZ;
              ALTER TABLE "user"
                ADD CONSTRAINT "user_locale_check" CHECK ("locale" IN ('en', 'es')),
                ADD CONSTRAINT "user_theme_check" CHECK ("theme" IN ('light', 'dark'));
      rollback:
        - sql:
            sql: ALTER TABLE "user" DROP COLUMN IF EXISTS "legacyImportedAt", DROP COLUMN IF EXISTS "theme", DROP COLUMN IF EXISTS "locale";

  - changeSet:
      id: users-003-open-signup-and-campaign-roles
      author: grimoire
      comment: >-
        Sign-ups no longer wait for an admin and dm/player stop being site roles (they are per campaign,
        via campaign_member). Pending accounts become approved; dm/player site roles collapse into user.
      changes:
        - sql:
            splitStatements: true
            sql: |
              ALTER TABLE "user" DROP CONSTRAINT "user_role_check", DROP CONSTRAINT "user_status_check";
              UPDATE "user" SET "status" = 'approved' WHERE "status" = 'pending';
              UPDATE "user" SET "role" = 'user' WHERE "role" <> 'admin';
              ALTER TABLE "user"
                ALTER COLUMN "role" SET DEFAULT 'user',
                ALTER COLUMN "status" SET DEFAULT 'approved',
                ADD CONSTRAINT "user_role_check" CHECK ("role" IN ('admin', 'user')),
                ADD CONSTRAINT "user_status_check" CHECK ("status" IN ('approved', 'blocked'));
      rollback:
        - sql:
            splitStatements: true
            sql: |
              ALTER TABLE "user" DROP CONSTRAINT "user_role_check", DROP CONSTRAINT "user_status_check";
              UPDATE "user" SET "role" = 'player' WHERE "role" = 'user';
              ALTER TABLE "user"
                ALTER COLUMN "role" SET DEFAULT 'player',
                ALTER COLUMN "status" SET DEFAULT 'pending',
                ADD CONSTRAINT "user_role_check" CHECK ("role" IN ('admin', 'dm', 'player')),
                ADD CONSTRAINT "user_status_check" CHECK ("status" IN ('pending', 'approved', 'blocked'));

  - changeSet:
      id: data-005-homebrew-monsters
      author: grimoire
      comment: >-
        Homebrew monster stat blocks. Private to the owner by default; the owner can share one with chosen
        campaigns or publish it to every approved account on the instance. An admin can lock a monster,
        which forces it back to private and stops the owner from publishing it again.
      changes:
        - sql:
            splitStatements: true
            sql: |
              CREATE TABLE "homebrew_monster" (
                "id" UUID PRIMARY KEY DEFAULT gen_random_uuid(),
                "ownerId" TEXT NOT NULL REFERENCES "user" ("id") ON DELETE CASCADE,
                "name" TEXT NOT NULL CHECK (char_length(btrim("name")) BETWEEN 1 AND 80),
                "cr" NUMERIC NOT NULL CHECK ("cr" BETWEEN 0 AND 30),
                "xp" INTEGER NOT NULL CHECK ("xp" BETWEEN 0 AND 200000),
                "type" TEXT NOT NULL DEFAULT '' CHECK (char_length("type") <= 40),
                "roleTags" JSONB NOT NULL DEFAULT '[]'::jsonb,
                "statBlock" JSONB NOT NULL CHECK (octet_length("statBlock"::text) <= 40000),
                "visibility" TEXT NOT NULL DEFAULT 'private' CHECK ("visibility" IN ('private', 'campaign', 'instance')),
                "locked" BOOLEAN NOT NULL DEFAULT false,
                "createdAt" TIMESTAMPTZ NOT NULL DEFAULT now(),
                "updatedAt" TIMESTAMPTZ NOT NULL DEFAULT now()
              );
              CREATE INDEX "homebrew_monster_ownerId_idx" ON "homebrew_monster" ("ownerId");
              CREATE INDEX "homebrew_monster_instance_idx" ON "homebrew_monster" ("updatedAt") WHERE "visibility" = 'instance';

              CREATE TABLE "homebrew_monster_campaign" (
                "monsterId" UUID NOT NULL REFERENCES "homebrew_monster" ("id") ON DELETE CASCADE,
                "campaignId" UUID NOT NULL REFERENCES "campaign" ("id") ON DELETE CASCADE,
                PRIMARY KEY ("monsterId", "campaignId")
              );
              CREATE INDEX "homebrew_monster_campaign_campaignId_idx" ON "homebrew_monster_campaign" ("campaignId");
      rollback:
        - sql:
            splitStatements: true
            sql: |
              DROP TABLE IF EXISTS "homebrew_monster_campaign";
              DROP TABLE IF EXISTS "homebrew_monster";

  - changeSet:
      id: users-004-signup-approval
      author: grimoire
      comment: >-
        Sign-ups wait for an admin again. Existing accounts keep their status; new ones start as pending
        (the owners in GRIMOIRE_ADMIN_EMAILS are approved by the sign-up hook).
      changes:
        - sql:
            splitStatements: true
            sql: |
              ALTER TABLE "user" DROP CONSTRAINT "user_status_check";
              ALTER TABLE "user"
                ALTER COLUMN "status" SET DEFAULT 'pending',
                ADD CONSTRAINT "user_status_check" CHECK ("status" IN ('pending', 'approved', 'blocked'));
      rollback:
        - sql:
            splitStatements: true
            sql: |
              ALTER TABLE "user" DROP CONSTRAINT "user_status_check";
              UPDATE "user" SET "status" = 'approved' WHERE "status" = 'pending';
              ALTER TABLE "user"
                ALTER COLUMN "status" SET DEFAULT 'approved',
                ADD CONSTRAINT "user_status_check" CHECK ("status" IN ('approved', 'blocked'));

  - changeSet:
      id: data-006-battle-maps
      author: grimoire
      comment: >-
        One shared battle map per campaign (grid size and tokens as JSON). Every member can see it;
        players move their own heroes, DMs place monsters and may keep them hidden from players.
        Changes are announced to open map streams with NOTIFY on the grimoire_battle_map channel.
      changes:
        - sql:
            splitStatements: true
            sql: |
              CREATE TABLE "battle_map" (
                "campaignId" UUID PRIMARY KEY REFERENCES "campaign" ("id") ON DELETE CASCADE,
                "state" JSONB NOT NULL CHECK (octet_length("state"::text) <= 60000),
                "version" INTEGER NOT NULL DEFAULT 0,
                "updatedAt" TIMESTAMPTZ NOT NULL DEFAULT now()
              );
      rollback:
        - sql:
            sql: DROP TABLE IF EXISTS "battle_map";
