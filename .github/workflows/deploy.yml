name: Deploy

on:
  workflow_dispatch:
    inputs:
      branch:
        description: Branch to deploy to the home server
        required: true
        default: main
        type: string

permissions:
  contents: read

concurrency:
  group: deploy-home-server
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy selected branch to the home server
    if: github.ref == 'refs/heads/main' && github.actor == 'Demi-12'
    runs-on: [self-hosted, linux, x64, grimoire-deploy]
    timeout-minutes: 30
    steps:
      - name: Validate branch name
        env:
          DEPLOY_BRANCH: ${{ inputs.branch }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$DEPLOY_BRANCH" =~ ^[A-Za-z0-9][A-Za-z0-9._/-]*$ ]]; then
            echo "Invalid branch name" >&2
            exit 2
          fi

      - name: Fetch selected branch and deploy locally
        env:
          DEPLOY_BRANCH: ${{ inputs.branch }}
        shell: bash
        run: |
          set -euo pipefail
          repo="$HOME/grimoire"
          git -C "$repo" fetch --quiet origin "refs/heads/$DEPLOY_BRANCH"
          git -C "$repo" checkout --quiet --detach FETCH_HEAD
          cd "$repo"
          CLOUDFLARE_TUNNEL_TOKEN=local-only docker compose up -d --build app db
