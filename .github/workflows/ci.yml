name: CI

on:
  push:
  pull_request:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Tests and integrity checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Scan repository history for leaked secrets
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITLEAKS_ENABLE_COMMENTS: false
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: false

      - name: Set up pnpm and Node.js
        uses: pnpm/setup@v3
        with:
          runtime: node@22
          cache: true
          require-lockfile: true

      - name: Run security configuration tests
        run: pnpm test

      - name: Type check
        run: pnpm typecheck

      - name: Build application
        run: pnpm build

      - name: Validate Compose configuration
        env:
          POSTGRES_DB: ci
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          DATABASE_URL: postgresql://ci:ci@db:5432/ci
          CLOUDFLARE_TUNNEL_TOKEN: ci
        run: docker compose config --quiet

      - name: Build application container
        env:
          POSTGRES_DB: ci
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          DATABASE_URL: postgresql://ci:ci@db:5432/ci
          CLOUDFLARE_TUNNEL_TOKEN: ci
        run: docker compose build app
