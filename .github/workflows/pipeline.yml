name: CI and deploy

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: pipeline-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Build and static checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Scan repository history for leaked secrets
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITLEAKS_ENABLE_COMMENTS: false
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: false

      - name: Set up pnpm and Node.js
        uses: pnpm/setup@v3
        with:
          runtime: node@22
          cache: true
          require-lockfile: true

      - name: Run security configuration tests
        run: pnpm test

      - name: Type check
        run: pnpm typecheck

      - name: Build application
        run: pnpm build

      - name: Validate Compose configuration
        env:
          POSTGRES_DB: ci
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          DATABASE_URL: postgresql://ci:ci@db:5432/ci
          CLOUDFLARE_TUNNEL_TOKEN: ci
        run: docker compose config --quiet

      - name: Build application container
        env:
          POSTGRES_DB: ci
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          DATABASE_URL: postgresql://ci:ci@db:5432/ci
          CLOUDFLARE_TUNNEL_TOKEN: ci
        run: docker compose build app

  deploy:
    name: Deploy to home server
    needs: checks
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      DEPLOY_PORT: ${{ vars.DEPLOY_PORT || '22' }}
      DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
      DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
    steps:
      - name: Configure verified SSH host
        shell: bash
        run: |
          set -euo pipefail
          install -m 700 -d "$RUNNER_TEMP/ssh"
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$RUNNER_TEMP/ssh/id_ed25519"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$RUNNER_TEMP/ssh/known_hosts"
          chmod 600 "$RUNNER_TEMP/ssh/id_ed25519" "$RUNNER_TEMP/ssh/known_hosts"
          {
            echo 'SSH_KEY_PATH<<EOF'
            echo "$RUNNER_TEMP/ssh/id_ed25519"
            echo EOF
          } >> "$GITHUB_ENV"

      - name: Deploy exact commit
        shell: bash
        run: |
          set -euo pipefail
          ssh -i "$SSH_KEY_PATH" \
            -p "$DEPLOY_PORT" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$RUNNER_TEMP/ssh/known_hosts" \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            "cd \"\$HOME/grimoire\" && git fetch --quiet origin \"$GITHUB_SHA\" && git checkout --quiet --detach \"$GITHUB_SHA\" && docker compose up -d --build --remove-orphans"

      - name: Remove temporary SSH material
        if: always()
        shell: bash
        run: rm -rf "$RUNNER_TEMP/ssh"
