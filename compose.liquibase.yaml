services:
  liquibase:
    image: liquibase/liquibase:4.33.0
    profiles: [migration]
    environment:
      LIQUIBASE_COMMAND_CHANGELOG_FILE: /liquibase/changelog/db.changelog-master.yaml
      LIQUIBASE_COMMAND_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:?Set POSTGRES_DB in the server environment}
      LIQUIBASE_COMMAND_USERNAME: ${LIQUIBASE_DB_USERNAME:?Set LIQUIBASE_DB_USERNAME for the migration job}
      LIQUIBASE_COMMAND_PASSWORD: ${LIQUIBASE_DB_PASSWORD:?Set LIQUIBASE_DB_PASSWORD for the migration job}
    volumes:
      - ./database/changelog:/liquibase/changelog:ro
    networks:
      - backend
    depends_on:
      db:
        condition: service_healthy
